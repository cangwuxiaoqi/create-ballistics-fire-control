# ===========================================================================
# NOTE: Gradle reads this file with the ISO-8859-1 charset, so DO NOT put
# non-ASCII here. The Chinese display name lives in the mods.toml template
# (src/main/templates/META-INF/neoforge.mods.toml), which is processed as UTF-8.
# ===========================================================================

# 国内网络下 Java 的 TLS 协商易被干扰（表现为 Connection reset），
# 显式锁定 TLS 版本并放宽 HTTP 超时，让 Gradle 能稳定拉取 maven.neoforged.net
org.gradle.jvmargs=-Xmx4G -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2 -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.repository.max.retries=10 -Dorg.gradle.internal.repository.initial.backoff=500
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 1.21.1 时期 datagen/jarJar 与配置缓存经常冲突，先关掉
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=true

# ---- 走本机代理访问 maven.neoforged.net ----
# 直连时 Java/Apache HttpClient 的 TLS 握手被 RST，必须经代理。
# 代理由用户启动（FlClash 等，监听 127.0.0.1:7890）。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]

# ---- 平台 ----
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.228
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# ---- 本 mod 元数据（保持 ASCII，中文见 mods.toml 模板）----
mod_id=create_ballistics
# GPL-3.0-only（不是 -or-later）：本项目并入了卓越前线(Superb Warfare)的 GPLv3 资产，
# 声明为 "or later" 会承诺一份上游给不出的许可（它只给 v3.0）。全文见工程根 LICENSE。
mod_license=GPL-3.0-only
# 版本沿革：
#   ⚠️⚠️ **2.0.0 就是正式发布版**（2026-09-29 用户拍板：把改名 / 声明补全 / 换文件名
#        这些"发布前该做的事"全做完之后，以 2.0.0 作为对外发布的那一版）。
#        ⇒ **版本号只在用户明确说"迭代到 X.Y.Z"时才改**（他说过：要迭代到 2.1.0 / 2.2.0
#        之类的时候才会通知）。**不许自己顺手抬版本号。**
#   沿革：2.0.0（正式）← 2.1.1 / 2.1.0（更名与声明补全的中间版本，未对外分发；
#        2.1.0 与大包实测定稿的 2.0.0 只差版本号字符串）。
#   （测试期那份 2.1.0-diag 是临时诊断版，已收工清理干净，不在任何地方发布。）
mod_version=2.0.0

# jar 文件名的英文部分：留空则用 Gradle 工程名（= modId `create_ballistics`）。
# 现在由 build.gradle 从 en_us.json 的物品组名自动生成
# （`Create Big Cannons: Fire Control Ballistics` → `Create_Big_Cannons_Fire_Control_Ballistics`），
# 所以**英文名只有 en_us.json 那一处源头**，这里不需要重复写。
mod_group_id=net.createballistics
mod_authors=CQ_WuQi
# ⚠️ 描述（中英并列）与显示名（含中文）都写在 mods.toml 模板里 —— 这里是 ISO-8859-1，放不了非 ASCII。

# ---- Bundled (JarJar) third-party runtime dependency: GeckoLib ----
# The drone is rendered by GeckoLib; we ship it INSIDE our own jar (META-INF/jarjar/),
# so users do not have to install it separately.
# At runtime NeoForge picks whoever is already there: an existing geckolib whose version
# falls inside geckolib_version_range wins, and our bundled copy is only the fallback.
# => The range below is the SINGLE source for two places that MUST be identical:
#    the mods.toml dependency range and the bundled META-INF/jarjar/metadata.json range.
#    If they ever disagree, the "another copy is already present" case turns into a
#    Duplicate-modid crash, so both are generated from this one property.
geckolib_version=4.7.5
geckolib_version_range=[4.7.5,5.0.0)
