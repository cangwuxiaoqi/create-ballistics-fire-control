# Access Transformer -- the mod currently needs exactly ONE entry, and it is the same one
# Superb Warfare uses (its line is word-for-word this class).
#
# ClientLevel.getEntities() is protected in vanilla. Opening it is the ONLY way to look an
# entity up by UUID on the client (Level#getEntities() itself is protected too).
#
# WHY, and WHY NOT the obvious alternative:
#   The obvious alternative, an AABB range query (level.getEntities(EntityTypeTest, AABB, ...)),
#   walks every NON-EMPTY entity section inside the box. A 512-block cube is ~100k sections,
#   and the drone camera asks for that lookup EVERY FRAME -> measurable frame stutter, and the
#   audio crackles with it (measured in game, 2026-09-23). getEntities().get(uuid) is a hash
#   lookup instead.
#
# Also note: the drone's own sync range is .clientTrackingRange(16) = 256 blocks, so the
# "walk the whole box" query could never find it farther out anyway.
#
# Access transformers are applied PER CLASS, so the entry must name the subclass that overrides
# the method: ClientLevel (the client one). The server path uses ServerLevel#getEntity(UUID),
# which is public already and needs no AT.
public net.minecraft.client.multiplayer.ClientLevel getEntities()Lnet/minecraft/world/level/entity/LevelEntityGetter;

# The drone's FPV overlay warns once the drone drifts past the range the server can still
# reliably keep in sync: (serverSimulationDistance * 16) - 48. Superb Warfare reads the same
# field from its drone HUD overlay, and it is private in vanilla -- opening it is what they do.
public net.minecraft.client.multiplayer.ClientPacketListener serverSimulationDistance
